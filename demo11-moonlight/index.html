<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>데모 11: Moonlight Shop</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; }
        body {
            background: #0a0a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: auto;
        }
        #game-container {
            border-radius: 4px; overflow: hidden;
        }
        .back-btn {
            position: fixed; top: 10px; left: 10px; z-index: 9999;
            background: #333; color: #aaa; border: none; padding: 6px 14px;
            border-radius: 6px; cursor: pointer; font-size: 13px; font-family: monospace;
        }
        .back-btn:hover { background: #555; color: #fff; }
    </style>
</head>
<body>
    <button class="back-btn" onclick="location.href='../'">← 목록</button>
    <div id="game-container"></div>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
    <!-- Data -->
    <script src="src/data/items.js"></script>
    <script src="src/data/zones.js"></script>
    <script src="src/data/customers.js"></script>
    <script src="src/data/recipes.js"></script>
    <script src="src/data/adventurers.js"></script>
    <script src="src/data/orders.js"></script>
    <script src="src/data/events.js"></script>
    <!-- UI -->
    <script src="src/ui/Button.js"></script>
    <script src="src/ui/Panel.js"></script>
    <script src="src/ui/Toast.js"></script>
    <!-- Systems -->
    <script src="src/systems/GameState.js"></script>
    <script src="src/systems/ExpeditionSystem.js"></script>
    <script src="src/systems/ShopSystem.js"></script>
    <!-- Scenes -->
    <script src="src/scenes/TitleScene.js"></script>
    <script src="src/scenes/MorningScene.js"></script>
    <script src="src/scenes/ShopScene.js"></script>
    <script src="src/scenes/CommissionScene.js"></script>
    <!-- Main -->
    <script src="src/main.js"></script>
</body>
</html>
